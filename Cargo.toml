[package]
name = "rustfetch"
version = "0.1.1"
edition = "2021"
rust-version = "1.74"
description = "A lightweight, fast, minimal system information tool for Linux"
readme = "README.md"
license = "MIT"
repository = "https://github.com/q7xk/rustfetch"
homepage = "https://github.com/q7xk/rustfetch"
documentation = "https://github.com/q7xk/rustfetch/tree/main/docs"
keywords = ["cli", "system", "fetch", "linux", "neofetch"]
categories = ["command-line-utilities"]
exclude = [
    ".github/*",
    "packaging/*",
    "target/*",
    "scripts/*",
    "tests/*",
    "fixtures/*",
]

[dependencies]
